{% extends 'base.html' %}

{% block title %}Smart ATM - Set New PIN{% endblock %}

{% block content %}
    <div class="form-header">
        <div class="header-icon-circle bg-blue">🔑</div>
        <h3>Set New ATM PIN</h3>
        <p class="form-subtitle">Choose a secure 4 or 6-digit numeric PIN</p>
    </div>

    <form method="post" class="atm-form">
        <label for="newPin">Enter New PIN:</label>
        <div class="input-wrapper">
            <span class="field-icon">🔒</span>
            <input type="password" id="newPin" name="pin" maxlength="6" placeholder="Enter new PIN" required autofocus>
        </div>

        <label for="confirmPin">Confirm New PIN:</label>
        <div class="input-wrapper">
            <span class="field-icon">🔒</span>
            <input type="password" id="confirmPin" name="cpin" maxlength="6" placeholder="Re-enter new PIN" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save New PIN</button>
    </form>

    {% if info %}
        <div class="info">{{ info }}</div>
    {% endif %}

    <div class="action-footer">
        <a href="{{ url_for('login') }}" class="btn-back">← Back to Login</a>
    </div>
{% endblock %}
